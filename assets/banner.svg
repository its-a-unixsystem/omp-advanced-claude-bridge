<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="omp-advanced-claude-bridge — Claude Code as a native Oh My Pi provider with isolated per-session panes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#0e141c"/>
      <stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="0.18" cy="0.22" r="0.45">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.84" cy="0.32" r="0.42">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0.78" cy="0.86" r="0.38">
      <stop offset="0%" stop-color="#e07a5f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e07a5f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.12"/>
    </pattern>
    <filter id="paneShadow" x="-12%" y="-14%" width="128%" height="138%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="8" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="canvasClip">
      <rect width="1280" height="360" rx="16"/>
    </clipPath>
    <clipPath id="pane1Clip">
      <rect width="440" height="132" rx="10"/>
    </clipPath>
    <clipPath id="pane2Clip">
      <rect width="432" height="98" rx="10"/>
    </clipPath>
    <clipPath id="pane3Clip">
      <rect width="424" height="92" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- base canvas -->
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#glowEmerald)"/>
    <rect width="1280" height="360" fill="url(#glowCyan)"/>
    <rect width="1280" height="360" fill="url(#glowCoral)"/>

    <!-- right-panel blueprint dot field -->
    <rect x="680" y="0" width="600" height="360" fill="url(#dots)"/>
    <line x1="680" y1="28" x2="680" y2="332" stroke="#1e293b" stroke-width="1"/>

    <!-- LEFT COLUMN: typography & technical spec bar -->
    <g transform="translate(64, 52)">
      <!-- eyebrow -->
      <rect x="0" y="0" width="188" height="26" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <circle cx="15" cy="13" r="3.5" fill="#34d399"/>
      <text x="28" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Code', monospace" font-size="11" font-weight="600" letter-spacing="0.9" fill="#a7f3d0">OH MY PI 19.2+ · MIT</text>

      <!-- stacked wordmark -->
      <text x="0" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Code', monospace" font-size="46" font-weight="700" letter-spacing="-0.8" fill="#f8fafc">omp-advanced-</text>
      <text x="0" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Code', monospace" font-size="46" font-weight="700" letter-spacing="-0.8" fill="#34d399">claude-bridge</text>

      <!-- subtitle -->
      <text x="0" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#cbd5e1">Run Claude Code as a first-class model provider in Oh My Pi.</text>
      <text x="0" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Isolated per-session transcripts, native TUI tools, and 1M / 200K control.</text>

      <!-- bottom technical spec strip -->
      <line x1="0" y1="226" x2="564" y2="226" stroke="#1e293b" stroke-width="1"/>

      <g transform="translate(0, 246)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="0" y="0" font-size="10" font-weight="600" letter-spacing="1.2" fill="#64748b">PROVIDER</text>
        <text x="0" y="20" font-size="14" font-weight="600" fill="#e2e8f0">claude-bridge</text>

        <text x="192" y="0" font-size="10" font-weight="600" letter-spacing="1.2" fill="#64748b">DELEGATION</text>
        <text x="192" y="20" font-size="14" font-weight="600" fill="#e2e8f0">AskClaude</text>

        <text x="360" y="0" font-size="10" font-weight="600" letter-spacing="1.2" fill="#64748b">CONTEXT WINDOWS</text>
        <text x="360" y="20" font-size="14" font-weight="600" fill="#e2e8f0">1M / 200K</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: stacked isolated session panes -->
    <!-- Pane 1: Primary OMP session -->
    <g transform="translate(724, 28)" filter="url(#paneShadow)">
      <g clip-path="url(#pane1Clip)">
        <rect x="0" y="0" width="440" height="132" fill="#0f1722"/>
        <rect x="0" y="0" width="440" height="32" fill="#16202e"/>
        <line x1="0" y1="32" x2="440" y2="32" stroke="#1e293b" stroke-width="1"/>
        <rect x="0" y="0" width="4" height="132" fill="#10b981"/>
      </g>
      <rect x="0.6" y="0.6" width="438.8" height="130.8" rx="9.4" fill="none" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="20" cy="16" r="3.5" fill="#334155"/>
      <circle cx="33" cy="16" r="3.5" fill="#334155"/>
      <circle cx="46" cy="16" r="3.5" fill="#334155"/>
      <text x="64" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#cbd5e1">main · claude-bridge/claude-opus-4-8</text>
      <rect x="384" y="7" width="44" height="18" rx="4" fill="#10b981" fill-opacity="0.16" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="406" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#34d399">1M</text>

      <!-- terminal body -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
        <text x="20" y="56" fill="#34d399">›</text>
        <text x="34" y="56" fill="#94a3b8">transcript</text>
        <text x="122" y="56" fill="#f1f5f9">native resume · verified prefix</text>

        <text x="20" y="80" fill="#34d399">›</text>
        <text x="34" y="80" fill="#94a3b8">mcp tools</text>
        <text x="122" y="80" fill="#e2e8f0">read · edit · bash · custom-tools</text>

        <text x="20" y="106" fill="#34d399">●</text>
        <text x="34" y="106" fill="#34d399" font-weight="600">isolated state</text>
        <!-- mini context meter -->
        <rect x="276" y="97" width="144" height="8" rx="4" fill="#1e293b"/>
        <rect x="276" y="97" width="54" height="8" rx="4" fill="#10b981"/>
      </g>
    </g>

    <!-- Pane 2: Concurrent subagent pane -->
    <g transform="translate(792, 146)" filter="url(#paneShadow)">
      <g clip-path="url(#pane2Clip)">
        <rect x="0" y="0" width="432" height="98" fill="#0f1722"/>
        <rect x="0" y="0" width="432" height="30" fill="#152130"/>
        <line x1="0" y1="30" x2="432" y2="30" stroke="#1e293b" stroke-width="1"/>
        <rect x="0" y="0" width="4" height="98" fill="#38bdf8"/>
      </g>
      <rect x="0.6" y="0.6" width="430.8" height="96.8" rx="9.4" fill="none" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="20" cy="15" r="3" fill="#334155"/>
      <circle cx="32" cy="15" r="3" fill="#334155"/>
      <circle cx="44" cy="15" r="3" fill="#334155"/>
      <text x="60" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#cbd5e1">subagent · claude-sonnet-5</text>
      <rect x="342" y="6" width="78" height="18" rx="4" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="381" y="18.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#7dd3fc">OWN SESSION</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
        <text x="20" y="54" fill="#38bdf8">›</text>
        <text x="34" y="54" fill="#e2e8f0">child-sub · independent history &amp; steer</text>
        <text x="20" y="78" fill="#38bdf8">●</text>
        <text x="34" y="78" fill="#7dd3fc">running concurrently · 200K</text>
      </g>
    </g>

    <!-- Pane 3: /btw & AskClaude pane -->
    <g transform="translate(744, 238)" filter="url(#paneShadow)">
      <g clip-path="url(#pane3Clip)">
        <rect x="0" y="0" width="424" height="92" fill="#0f1722"/>
        <rect x="0" y="0" width="424" height="30" fill="#1b1b24"/>
        <line x1="0" y1="30" x2="424" y2="30" stroke="#1e293b" stroke-width="1"/>
        <rect x="0" y="0" width="4" height="92" fill="#e07a5f"/>
      </g>
      <rect x="0.6" y="0.6" width="422.8" height="90.8" rx="9.4" fill="none" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="20" cy="15" r="3" fill="#334155"/>
      <circle cx="32" cy="15" r="3" fill="#334155"/>
      <circle cx="44" cy="15" r="3" fill="#334155"/>
      <text x="60" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#cbd5e1">/btw · AskClaude delegation</text>
      <rect x="336" y="6" width="76" height="18" rx="4" fill="#e07a5f" fill-opacity="0.16" stroke="#e07a5f" stroke-opacity="0.45"/>
      <text x="374" y="18.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#f4a28c">EPHEMERAL</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
        <text x="20" y="54" fill="#e07a5f">›</text>
        <text x="34" y="54" fill="#e2e8f0">side queries never touch primary state</text>
        <text x="20" y="76" fill="#e07a5f">●</text>
        <text x="34" y="76" fill="#f4a28c">mode: read · isolated: true</text>
      </g>
    </g>
  </g>

  <!-- crisp outer frame -->
  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
