<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="omp-advanced-claude-bridge — Run Claude Code natively inside Oh My Pi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f18"/>
      <stop offset="0.52" stop-color="#171425"/>
      <stop offset="1" stop-color="#1d1413"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="laneA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="laneB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.22" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.78" cy="0.35" r="0.48">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glowLeft)"/>
  <rect width="1280" height="360" fill="url(#glowRight)"/>

  <!-- subtle architectural grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="270" x2="1280" y2="270"/>
    <line x1="256" y1="0" x2="256" y2="360"/>
    <line x1="512" y1="0" x2="512" y2="360"/>
    <line x1="768" y1="0" x2="768" y2="360"/>
    <line x1="1024" y1="0" x2="1024" y2="360"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Code', monospace" font-size="54" font-weight="700" letter-spacing="0.5" fill="#f8fafc">omp-advanced-claude-bridge</text>

  <!-- tagline -->
  <text x="640" y="152" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" opacity="0.92">Run Claude Code natively inside Oh My Pi with an isolated per-session core</text>

  <!-- feature chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">
    <g transform="translate(305,178)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.3"/>
      <text x="56" y="18.5" text-anchor="middle">AskClaude</text>
    </g>
    <g transform="translate(429,178)">
      <rect x="0" y="0" width="164" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#f472b6" stroke-opacity="0.3"/>
      <text x="82" y="18.5" text-anchor="middle">Per-Session Core</text>
    </g>
    <g transform="translate(605,178)">
      <rect x="0" y="0" width="172" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.3"/>
      <text x="86" y="18.5" text-anchor="middle">1M / 200K Context</text>
    </g>
    <g transform="translate(789,178)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="55" y="18.5" text-anchor="middle">OMP 19.2+</text>
    </g>
    <g transform="translate(911,178)">
      <rect x="0" y="0" width="64" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="32" y="18.5" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- multi-session bridge motif -->
  <g transform="translate(0,284)">
    <!-- secondary isolated session lanes (subagents & side requests) -->
    <path d="M 210 -6 C 420 -50 860 -50 1070 -6" fill="none" stroke="url(#laneB)" stroke-width="1.75" stroke-dasharray="6 6" opacity="0.65"/>
    <path d="M 210 6 C 420 34 860 34 1070 6" fill="none" stroke="url(#laneA)" stroke-width="1.75" stroke-dasharray="4 6" opacity="0.55"/>

    <!-- main glowing span -->
    <path d="M 210 0 C 420 -36 860 -36 1070 0" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" filter="url(#soft)" opacity="0.65"/>
    <path d="M 210 0 C 420 -36 860 -36 1070 0" fill="none" stroke="url(#accent)" stroke-width="2.75" stroke-linecap="round"/>

    <!-- session lane nodes along the bridge -->
    <circle cx="480" cy="-21" r="4" fill="#0d0f18" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="640" cy="-26" r="4.5" fill="#0d0f18" stroke="#f472b6" stroke-width="2"/>
    <circle cx="800" cy="-21" r="4" fill="#0d0f18" stroke="#f59e0b" stroke-width="2"/>

    <!-- endpoint nodes -->
    <circle cx="210" cy="0" r="14" fill="#0d0f18" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="210" cy="0" r="5" fill="#a78bfa"/>

    <circle cx="1070" cy="0" r="14" fill="#0d0f18" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="1070" cy="0" r="5" fill="#f59e0b"/>

    <!-- endpoint labels -->
    <text x="210" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#cbd5e1">Oh My Pi</text>
    <text x="640" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94a3b8" letter-spacing="0.6">claude-bridge · isolated sessions</text>
    <text x="1070" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#cbd5e1">Claude Code</text>
  </g>
</svg>
